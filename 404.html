<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>No Sync</title>
</head>
<body>
  <script>
    (() => {
      const parts = location.pathname.split('/').filter(Boolean);
      const index = parts.lastIndexOf('presave');
      const slug = index >= 0 ? parts[index + 1] : '';
      if (slug && /^[a-z0-9]+(?:-[a-z0-9]+)*$/.test(slug)) {
        const base = location.pathname.slice(0, location.pathname.indexOf('/presave/') + 9);
        location.replace(base + '?release=' + encodeURIComponent(slug));
        return;
      }
      location.replace('/');
    })();
  </script>
</body>
</html>
