name: Temporary Namecheap fallback publish

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-namecheap-fallback.yml"

permissions:
  contents: read

concurrency:
  group: namecheap-production
  cancel-in-progress: false

jobs:
  publish:
    name: Publish tested commit without Pages CMS
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout exact tested commit
        uses: actions/checkout@v4
        with:
          ref: 2e884854fd8209e6785221b8edf9ce98f792d34c
          fetch-depth: 1

      - name: Check Namecheap configuration
        env:
          FTP_HOST: ${{ secrets.NAMECHEAP_FTP_HOST }}
          FTP_USER: ${{ secrets.NAMECHEAP_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.NAMECHEAP_FTP_PASSWORD }}
        run: |
          test -n "$FTP_HOST" || { echo "Missing secret NAMECHEAP_FTP_HOST"; exit 1; }
          test -n "$FTP_USER" || { echo "Missing secret NAMECHEAP_FTP_USER"; exit 1; }
          test -n "$FTP_PASSWORD" || { echo "Missing secret NAMECHEAP_FTP_PASSWORD"; exit 1; }

      - name: Install secure FTP client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp

      - name: Publish website to Namecheap
        env:
          FTP_HOST: ${{ secrets.NAMECHEAP_FTP_HOST }}
          FTP_USER: ${{ secrets.NAMECHEAP_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.NAMECHEAP_FTP_PASSWORD }}
        run: |
          lftp -u "$FTP_USER","$FTP_PASSWORD" "ftp://$FTP_HOST:21" -e '
            set cmd:fail-exit true;
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ssl:verify-certificate true;
            set net:max-retries 2;
            set net:timeout 30;
            mirror --reverse --verbose --parallel=2               --exclude-glob .git/**               --exclude-glob .github/**               --exclude-glob .pages.yml               --exclude-glob README.md               --exclude-glob CMS-GUIDE.md               --exclude-glob NAMECHEAP-DEPLOY.md               --exclude-glob scripts/**               ./ /;
            bye
          '

      - name: Publication summary
        run: |
          {
            echo "### Temporary fallback publication completed"
            echo ""
            echo "- Published commit: `2e884854fd8209e6785221b8edf9ce98f792d34c`"
            echo "- Reason: Pages CMS unavailable"
          } >> "$GITHUB_STEP_SUMMARY"
