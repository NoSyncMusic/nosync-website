name: Publish analytics tracker once

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  publish-analytics:
    if: github.event.head_commit.message == 'Publish first-party analytics tracker to Namecheap'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Check Namecheap secrets
        env:
          FTP_HOST: ${{ secrets.NAMECHEAP_FTP_HOST }}
          FTP_USER: ${{ secrets.NAMECHEAP_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.NAMECHEAP_FTP_PASSWORD }}
        run: |
          test -n "$FTP_HOST"
          test -n "$FTP_USER"
          test -n "$FTP_PASSWORD"

      - name: Install FTPS client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp

      - name: Publish analytics loader only
        env:
          FTP_HOST: ${{ secrets.NAMECHEAP_FTP_HOST }}
          FTP_USER: ${{ secrets.NAMECHEAP_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.NAMECHEAP_FTP_PASSWORD }}
        run: |
          lftp -u "$FTP_USER","$FTP_PASSWORD" "ftp://$FTP_HOST:21" -e '
            set cmd:fail-exit true;
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ssl:verify-certificate true;
            set net:max-retries 2;
            set net:timeout 30;
            put -O / page-transitions.js;
            bye
          '

      - name: Verify production analytics loader
        run: |
          set -euo pipefail
          local_hash="$(sha256sum page-transitions.js | awk '{print $1}')"
          remote_hash="$(curl --fail --silent --show-error --location --retry 5 --retry-delay 2             "https://nosyncmusic.com/page-transitions.js?verify=${{ github.run_id }}" | sha256sum | awk '{print $1}')"
          test "$local_hash" = "$remote_hash"
          grep -q "portal.nosyncmusic.com/analytics.js" page-transitions.js
          echo "Analytics loader is live on nosyncmusic.com"
