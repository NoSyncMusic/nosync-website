name: Site browser smoke tests

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "script.js"
      - "styles.css"
      - "page-transitions.js"
      - "site-core.js"
      - "404.html"
      - "under-construction/**"
      - "presave-demo.html"
      - "content.json"
      - "settings.json"
      - "releases/**"
      - "presave/**"
      - ".github/site-tests/**"
      - "package.json"
      - ".pages.yml"
      - ".github/workflows/site-browser-smoke.yml"

permissions:
  contents: read

concurrency:
  group: site-browser-smoke
  cancel-in-progress: true

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install test dependencies
        run: npm install --no-audit --no-fund

      - name: Validate Pages CMS configuration
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import YAML from 'yaml';
          const source = fs.readFileSync('.pages.yml', 'utf8');
          const parsed = YAML.parse(source);
          const flatten = (entries = []) => entries.flatMap((entry) =>
            entry?.type === 'group' ? flatten(Array.isArray(entry.items) ? entry.items : []) : [entry]);
          const entries = parsed && Array.isArray(parsed.content) ? flatten(parsed.content) : [];
          const names = new Set(entries.map((entry) => entry?.name));
          if (!names.has('appearance') || !names.has('homepage')) {
            throw new Error('Pages CMS config is missing the appearance or homepage editor.');
          }

          const workflowDir = '.github/workflows';
          const workflowFiles = fs.readdirSync(workflowDir)
            .filter((name) => name.endsWith('.yml') || name.endsWith('.yaml'));
          for (const file of workflowFiles) {
            YAML.parse(fs.readFileSync(`${workflowDir}/${file}`, 'utf8'));
          }

          console.log(`Configuration valid: Pages CMS + ${workflowFiles.length} GitHub workflows.`);
          NODE

      - name: Enforce frontend asset budgets
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const budgets = {
            'styles.css': 100_000,
            'script.js': 100_000,
            'site-core.js': 30_000,
            'page-transitions.js': 20_000,
            'releases/releases.js': 80_000,
            'presave/presave.js': 50_000
          };
          for (const [file, limit] of Object.entries(budgets)) {
            const bytes = fs.statSync(file).size;
            if (bytes > limit) {
              throw new Error(`${file} exceeds its budget: ${bytes} > ${limit} bytes`);
            }
            console.log(`${file}: ${bytes}/${limit} bytes`);
          }
          NODE

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Start local site
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/nosync-site.log 2>&1 &
          echo $! > /tmp/nosync-site.pid
          for i in {1..20}; do
            curl --fail --silent http://127.0.0.1:4173/index.html >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/nosync-site.log
          exit 1

      - name: Run browser matrix
        run: node .github/site-tests/smoke.mjs
