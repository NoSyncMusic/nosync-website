name: Sync Spotify releases

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: spotify-release-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Sync releases by ISRC
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_ARTIST_ID: "6jG0cf5NUIIkxydJ9zTa8B"
        run: node scripts/sync-spotify.mjs

      - name: Commit release updates
        run: |
          if git diff --quiet -- content.json; then
            echo "No Spotify changes."
            exit 0
          fi
          git config user.name "No Sync Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add content.json
          git commit -m "Auto-update Spotify release data"
          git pull --rebase origin main
          git push
