name: Publish to Namecheap

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      payload:
        description: Pages CMS action payload (leave empty for manual fallback)
        required: false
        type: string
      commit_sha:
        description: Manual fallback — exact tested commit SHA (leave empty when using Pages CMS)
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: namecheap-production
  cancel-in-progress: false

jobs:
  publish:
    name: Publish tested commit
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'Publish Career Control Center website updates'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Resolve production commit
        id: release
        env:
          PAGES_PAYLOAD: ${{ inputs.payload }}
          MANUAL_SHA: ${{ inputs.commit_sha }}
          EXPECTED_REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json
          import os
          import re

          payload_raw = os.environ.get("PAGES_PAYLOAD", "").strip()
          manual_sha = os.environ.get("MANUAL_SHA", "").strip()
          expected = os.environ["EXPECTED_REPOSITORY"]
          event_name = os.environ.get("GITHUB_EVENT_NAME", "")
          event_sha = os.environ.get("GITHUB_SHA", "").strip()

          if event_name == "push":
              sha = event_sha
              trigger = "Career Control Center rollout"
          elif bool(payload_raw) == bool(manual_sha):
              raise SystemExit("Provide exactly one source: Pages CMS payload or manual commit SHA.")
          elif payload_raw:
              payload = json.loads(payload_raw)
              repository = payload.get("repository") or {}
              owner = repository.get("owner", "")
              repo = repository.get("repo", "")
              actual = f"{owner}/{repo}"
              sha = str(repository.get("sha", "")).strip()
              if payload.get("source") != "pages-cms":
                  raise SystemExit("Invalid Pages CMS payload source.")
              if actual.lower() != expected.lower():
                  raise SystemExit(f"Repository mismatch: {actual} != {expected}")
              trigger = "Pages CMS"
          elif event_name != "push":
              sha = manual_sha
              trigger = "Manual GitHub fallback"

          if not re.fullmatch(r"[0-9a-fA-F]{40}", sha):
              raise SystemExit("A full 40-character commit SHA is required.")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"sha={sha.lower()}\n")
              fh.write(f"trigger={trigger}\n")

          print(f"Selected production commit: {sha} ({trigger})")
          PY

      - name: Checkout exact selected commit
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.sha }}
          fetch-depth: 0

      - name: Verify commit belongs to main
        env:
          TARGET_SHA: ${{ steps.release.outputs.sha }}
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$TARGET_SHA" origin/main || {
            echo "Selected commit is not part of main."
            exit 1
          }

      - name: Require green preview and browser tests
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.release.outputs.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import urllib.request

          repo = os.environ["REPOSITORY"]
          sha = os.environ["TARGET_SHA"]
          token = os.environ["GH_TOKEN"]
          required = {
              "Site browser smoke tests": None,
              "pages build and deployment": None,
          }

          url = f"https://api.github.com/repos/{repo}/actions/runs?head_sha={sha}&per_page=100"
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "nosync-production-gate",
          }

          for attempt in range(30):
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=30) as response:
                  runs = json.load(response).get("workflow_runs", [])

              for name in required:
                  matches = [run for run in runs if run.get("name") == name]
                  if matches:
                      latest = sorted(matches, key=lambda run: run.get("created_at", ""), reverse=True)[0]
                      required[name] = (latest.get("status"), latest.get("conclusion"))

              print("Required checks:", required)

              failed = [
                  name for name, state in required.items()
                  if state and state[0] == "completed" and state[1] not in ("success", None)
              ]
              if failed:
                  raise SystemExit("Required check failed: " + ", ".join(failed))

              if all(state == ("completed", "success") for state in required.values()):
                  print("Exact commit has a green Pages preview and browser test run.")
                  break

              if attempt == 29:
                  missing = ", ".join(name for name, state in required.items() if state != ("completed", "success"))
                  raise SystemExit("Timed out waiting for required green checks: " + missing)

              time.sleep(20)
          PY

      - name: Check Namecheap configuration
        env:
          FTP_HOST: ${{ secrets.NAMECHEAP_FTP_HOST }}
          FTP_USER: ${{ secrets.NAMECHEAP_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.NAMECHEAP_FTP_PASSWORD }}
        run: |
          test -n "$FTP_HOST" || { echo "Missing secret NAMECHEAP_FTP_HOST"; exit 1; }
          test -n "$FTP_USER" || { echo "Missing secret NAMECHEAP_FTP_USER"; exit 1; }
          test -n "$FTP_PASSWORD" || { echo "Missing secret NAMECHEAP_FTP_PASSWORD"; exit 1; }

      - name: Install secure FTP client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp

      - name: Publish website to Namecheap
        env:
          FTP_HOST: ${{ secrets.NAMECHEAP_FTP_HOST }}
          FTP_USER: ${{ secrets.NAMECHEAP_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.NAMECHEAP_FTP_PASSWORD }}
        run: |
          lftp -u "$FTP_USER","$FTP_PASSWORD" "ftp://$FTP_HOST:21" -e '
            set cmd:fail-exit true;
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ssl:verify-certificate true;
            set net:max-retries 2;
            set net:timeout 30;
            mirror --reverse --verbose --parallel=2 --exclude-glob .git/** --exclude-glob .github/** --exclude-glob .pages.yml --exclude-glob README.md --exclude-glob CMS-GUIDE.md --exclude-glob NAMECHEAP-DEPLOY.md --exclude-glob package.json --exclude-glob package-lock.json --exclude-glob scripts/** ./ /;
            mirror --reverse --delete --verbose --parallel=2 presave/ /presave/;
            bye
          '

      - name: Verify production files
        env:
          VERIFY_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          for path in "/" "/releases/"; do
            curl --fail --silent --show-error --location --retry 5 --retry-delay 2               "https://nosyncmusic.com${path}?verify=${VERIFY_ID}" >/dev/null
          done

          for file in "page-transitions.js" "content.json"; do
            local_hash="$(sha256sum "$file" | awk '{print $1}')"
            remote_hash="$(curl --fail --silent --show-error --location --retry 5 --retry-delay 2               "https://nosyncmusic.com/${file}?verify=${VERIFY_ID}" | sha256sum | awk '{print $1}')"
            test "$local_hash" = "$remote_hash" || {
              echo "Production verification failed for $file"
              exit 1
            }
          done

      - name: Publication summary
        run: |
          {
            echo "### Namecheap publication completed"
            echo ""
            echo "- Repository: `${{ github.repository }}`"
            echo "- Published commit: `${{ steps.release.outputs.sha }}`"
            echo "- Trigger: `${{ steps.release.outputs.trigger }}`"
            echo "- Required preview checks: passed"
            echo "- Production verification: passed"
            echo ""
            echo "The same workflow can be used to roll back by manually publishing any previously tested commit that is still part of main."
          } >> "$GITHUB_STEP_SUMMARY"
