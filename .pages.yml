media:
  input: media
  output: media
content:
- name: appearance
  label: Homepage & kleuren
  type: file
  path: settings.json
  format: json
  fields:
  - name: artistName
    label: Artiestennaam
    type: string
  - name: pageTitle
    label: Titel in het browsertabblad
    type: string
  - name: hero
    label: Bovenkant homepage
    type: object
    fields:
    - name: title
      label: Grote titel
      type: text
      required: true
      description: Elke regel staat op desktop op een nieuwe regel. Bijvoorbeeld NO
        en SYNC.
    - name: suffix
      label: Teken achter de titel
      type: string
      description: Bijvoorbeeld een punt. Maak leeg om het weg te laten.
    - name: tagline
      label: Tekst boven de grote titel
      type: string
    - name: genres
      label: Tekst onder de grote titel
      type: string
    - name: intro
      label: Extra introductietekst
      type: text
      description: Optioneel. Een leeg veld wordt niet getoond.
    - name: image
      label: Artiestenfoto
      type: image
    - name: logo
      label: Logo
      type: image
    - name: photoCaption
      label: Tekst onderaan de foto
      type: string
    - name: listenButton
      label: Tekst luisterknop
      type: string
      required: true
    - name: bookingButton
      label: Tekst contactknop
      type: string
      required: true
  - name: navigation
    label: Menu
    type: object
    fields:
    - name: music
      label: Muziek
      type: string
    - name: explore
      label: Sets en playlists
      type: string
    - name: shows
      label: Shows
      type: string
    - name: contact
      label: Contact
      type: string
  - name: music
    label: Muzieksectie
    type: object
    fields:
    - name: eyebrow
      label: Kleine tekst boven de kop
      type: string
    - name: title
      label: Kop
      type: string
      required: true
    - name: spotifyLabel
      label: Tekst Spotify-link
      type: string
  - name: links
    label: Sectie met sets en playlists
    type: object
    fields:
    - name: eyebrow
      label: Kleine tekst boven de kop
      type: string
    - name: title
      label: Kop
      type: string
      required: true
  - name: shows
    label: Showsectie
    type: object
    fields:
    - name: eyebrow
      label: Kleine tekst boven de kop
      type: string
    - name: title
      label: Kop
      type: string
      required: true
    - name: bandsintownLabel
      label: Tekst Bandsintown-link
      type: string
    - name: ticketLabel
      label: Tekst ticketknop
      type: string
    - name: soldOutLabel
      label: Tekst bij uitverkocht
      type: string
    - name: moreInfoLabel
      label: Tekst als ticketlink nog ontbreekt
      type: string
    - name: emptyMessage
      label: Tekst als er geen komende shows zijn
      type: text
    - name: defaultTitle
      label: Terugvaltekst als een show geen titel heeft
      type: string
  - name: contact
    label: Contactsectie
    type: object
    fields:
    - name: eyebrow
      label: Kleine tekst boven de kop
      type: string
    - name: title
      label: Kop
      type: string
      required: true
    - name: presskitLabel
      label: Tekst presskitknop
      type: string
  - name: footer
    label: Onderaan de website
    type: object
    fields:
    - name: name
      label: Naam naast het copyrightjaar
      type: string
    - name: backToTop
      label: Tekst terug naar boven
      type: string
  - name: colors
    label: Kleuren
    type: object
    fields:
    - name: accent
      label: Accentkleur (nu rood)
      type: string
      required: true
      description: 'HEX-kleurcode, bijvoorbeeld #ff535a.'
      pattern:
        regex: ^#[0-9a-fA-F]{6}$
        message: 'Gebruik # gevolgd door 6 tekens, bijvoorbeeld #ff535a.'
    - name: background
      label: Achtergrondkleur
      type: string
      required: true
      description: 'HEX-kleurcode, bijvoorbeeld #101010.'
      pattern:
        regex: ^#[0-9a-fA-F]{6}$
        message: 'Gebruik # gevolgd door 6 tekens, bijvoorbeeld #ff535a.'
    - name: text
      label: Tekstkleur
      type: string
      required: true
      description: 'HEX-kleurcode, bijvoorbeeld #f5f4ef.'
      pattern:
        regex: ^#[0-9a-fA-F]{6}$
        message: 'Gebruik # gevolgd door 6 tekens, bijvoorbeeld #ff535a.'
    - name: headings
      label: Kleur van grote titels en koppen
      type: string
      required: true
      description: 'HEX-kleurcode, bijvoorbeeld #f5f4ef.'
      pattern:
        regex: ^#[0-9a-fA-F]{6}$
        message: 'Gebruik # gevolgd door 6 tekens, bijvoorbeeld #ff535a.'
    - name: secondary
      label: Kleur van ondertitels en overige kleine tekst
      type: string
      required: true
      description: 'HEX-kleurcode, bijvoorbeeld #aaa9a3.'
      pattern:
        regex: ^#[0-9a-fA-F]{6}$
        message: 'Gebruik # gevolgd door 6 tekens, bijvoorbeeld #ff535a.'
    - name: buttonText
      label: Tekstkleur van de gekleurde luisterknop
      type: string
      required: true
      description: 'HEX-kleurcode, bijvoorbeeld #101010.'
      pattern:
        regex: ^#[0-9a-fA-F]{6}$
        message: 'Gebruik # gevolgd door 6 tekens, bijvoorbeeld #ff535a.'
    - name: surface
      label: Achtergrondkleur van kaarten
      type: string
      required: true
      description: 'HEX-kleurcode, bijvoorbeeld #191919.'
      pattern:
        regex: ^#[0-9a-fA-F]{6}$
        message: 'Gebruik # gevolgd door 6 tekens, bijvoorbeeld #ff535a.'
    - name: borders
      label: Kleur van lijnen en randen
      type: string
      required: true
      description: 'HEX-kleurcode, bijvoorbeeld #30302d.'
      pattern:
        regex: ^#[0-9a-fA-F]{6}$
        message: 'Gebruik # gevolgd door 6 tekens, bijvoorbeeld #ff535a.'
- name: homepage
  label: Muziek, links & contact
  type: file
  path: content.json
  format: json
  fields:
  - name: socials
    label: Socials
    type: object
    list: true
    fields:
    - name: type
      label: Platform
      type: select
      options:
        values:
        - INSTAGRAM
        - SPOTIFY
        - YOUTUBE
        - TIKTOK
        - FACEBOOK
        - SOUNDCLOUD
        - TWITTER
    - name: url
      label: Link
      type: string
    - name: label
      label: Eigen tekst voor deze link (optioneel)
      type: string
  - name: releases
    label: Releases
    type: object
    list: true
    fields:
    - name: title
      label: Titel
      type: string
    - name: artist
      label: Artiesten
      type: string
    - name: artwork
      label: Artwork
      type: image
    - name: featured
      label: Uitgelichte release
      type: boolean
    - name: badge
      label: Label boven titel
      type: string
    - name: visible
      label: Zichtbaar
      type: boolean
    - name: links
      label: Luisterlinks
      type: object
      list: true
      fields:
      - name: type
        label: Platform
        type: select
        options:
          values:
          - SPOTIFY
          - APPLE_MUSIC
          - YOUTUBE_MUSIC
          - DEEZER
          - BEATPORT
          - SOUNDCLOUD
          - AMAZON_MUSIC
          - ANGHAMMI
          - TIDAL
      - name: url
        label: Link
        type: string
      - name: label
        label: Eigen tekst voor deze link (optioneel)
        type: string
  - name: links
    label: Sets, playlists en overige links
    type: object
    list: true
    fields:
    - name: title
      label: Titel
      type: string
    - name: subtitle
      label: Ondertitel
      type: string
    - name: url
      label: Link
      type: string
    - name: image
      label: Afbeelding
      type: image
    - name: visible
      label: Zichtbaar
      type: boolean
  - name: shows
    label: Shows
    type: object
    list: true
    fields:
    - name: date
      label: Datum (JJJJ-MM-DD)
      type: string
    - name: title
      label: Evenement
      type: string
    - name: venue
      label: Venue
      type: string
    - name: location
      label: Locatie
      type: string
    - name: ticketUrl
      label: Ticketlink (leeg als nog onbekend)
      type: string
    - name: soldOut
      label: Uitverkocht
      type: boolean
    - name: visible
      label: Zichtbaar
      type: boolean
  - name: bandsintown
    label: Bandsintown-link
    type: string
  - name: presskit
    label: Presskit-link
    type: string
  - name: contacts
    label: Contactgegevens
    type: object
    list: true
    fields:
    - name: label
      label: Categorie
      type: string
    - name: email
      label: E-mailadres
      type: string
    - name: note
      label: Toelichting
      type: text
