media:
  input: media
  output: media
content:
- name: appearance
  label: Design, teksten & kleuren
  type: file
  path: settings.json
  format: json
  fields:
  - name: artistName
    label: Artiestennaam
    type: string
  - name: pageTitle
    label: Titel in het browsertabblad
    type: string
  - name: description
    label: Omschrijving voor zoekmachines
    type: text
    description: Korte Engelse omschrijving van de artiest en website.
  - name: hero
    label: Bovenkant homepage
    type: object
    fields:
    - name: title
      label: Grote titel
      type: text
      required: true
      description: Elke regel staat op desktop op een nieuwe regel. Bijvoorbeeld NO en SYNC.
    - name: suffix
      label: Teken achter de titel
      type: string
      description: Bijvoorbeeld een punt. Maak leeg om het weg te laten.
    - name: tagline
      label: Tekst boven de grote titel
      type: string
    - name: genres
      label: Tekst onder de grote titel
      type: string
    - name: intro
      label: Extra introductietekst
      type: text
      description: Optioneel. Een leeg veld wordt niet getoond.
    - name: image
      label: Artiestenfoto
      type: image
    - name: logo
      label: Logo
      type: image
    - name: photoCaption
      label: Tekst onderaan de foto
      type: string
    - name: listenButton
      label: Tekst luisterknop
      type: string
      required: true
    - name: bookingButton
      label: Tekst contactknop
      type: string
      required: true
  - name: navigation
    label: Menu
    type: object
    fields:
    - name: music
      label: Muziek
      type: string
    - name: explore
      label: Sets en playlists
      type: string
    - name: shows
      label: Shows
      type: string
    - name: contact
      label: Contact
      type: string
  - name: music
    label: Muzieksectie
    type: object
    fields:
    - name: eyebrow
      label: Kleine tekst boven de kop
      type: string
    - name: title
      label: Kop
      type: string
      required: true
    - name: allReleasesLabel
      label: Tekst All releases-knop
      type: string
    - name: allReleasesEyebrow
      label: Kleine tekst op All releases-pagina
      type: string
    - name: allReleasesTitle
      label: Titel op All releases-pagina
      type: string
    - name: streamHereLabel
      label: Tekst Stream Here-knop
      type: string
    - name: streamModalTitle
      label: Tekst boven streamingdiensten in popup
      type: string
    - name: streamModalEyebrow
      label: Kleine tekst bovenaan streamingpopup
      type: string
    - name: openPlatformLabel
      label: Tekst rechts naast iedere streamingdienst
      type: string
    - name: closeModalLabel
      label: Toegankelijk label sluitknop
      type: string
  - name: upcoming
    label: Aankomende release
    type: object
    fields:
    - name: eyebrow
      label: Kleine tekst boven de kop
      type: string
    - name: title
      label: Kop
      type: string
    - name: presaveLabel
      label: Tekst pre-saveknop
      type: string
    - name: releasedLabel
      label: Tekst luisterknop na release
      type: string
    - name: followNote
      label: Toelichting pre-save en follow
      type: text
    - name: countdownLabel
      label: Tekst achter countdown
      type: string
    - name: servicesLabel
      label: Tekst boven streamingdiensten
      type: string
  - name: links
    label: Sectie met sets en playlists
    type: object
    fields:
    - name: eyebrow
      label: Kleine tekst boven de kop
      type: string
    - name: title
      label: Kop
      type: string
      required: true
    - name: primaryLabel
      label: Label boven fanlinks
      type: string
    - name: secondaryLabel
      label: Label boven links voor artiesten
      type: string
  - name: shows
    label: Showsectie
    type: object
    fields:
    - name: source
      label: Shows automatisch laden
      type: select
      options:
        values:
        - bandsintown
        - manual
      description: 'bandsintown: gepubliceerde shows automatisch uit Bandsintown. manual: de shows die
        je hieronder in het CMS invult.'
    - name: eyebrow
      label: Kleine tekst boven de kop
      type: string
    - name: title
      label: Kop
      type: string
      required: true
    - name: bandsintownLabel
      label: Tekst Bandsintown-link
      type: string
    - name: ticketLabel
      label: Tekst ticketknop
      type: string
    - name: soldOutLabel
      label: Tekst bij uitverkocht
      type: string
    - name: moreInfoLabel
      label: Tekst als ticketlink nog ontbreekt
      type: string
    - name: emptyMessage
      label: Tekst als er geen komende shows zijn
      type: text
    - name: defaultTitle
      label: Terugvaltekst als een show geen titel heeft
      type: string
    - name: venuePendingLabel
      label: Tekst als de venue nog onbekend is
      type: string
    - name: loadingLabel
      label: Tekst tijdens laden
      type: string
    - name: fallbackLabel
      label: Linktekst als Bandsintown niet kan laden
      type: string
  - name: contact
    label: Contactsectie
    type: object
    fields:
    - name: eyebrow
      label: Kleine tekst boven de kop
      type: string
    - name: title
      label: Kop
      type: string
      required: true
    - name: presskitLabel
      label: Tekst presskitknop
      type: string
  - name: footer
    label: Onderaan de website
    type: object
    fields:
    - name: name
      label: Naam naast het copyrightjaar
      type: string
    - name: backToTop
      label: Tekst terug naar boven
      type: string
  - name: colors
    label: Kleuren
    type: object
    fields:
    - name: accent
      label: Accentkleur (knoppen en details)
      type: string
      required: true
      description: 'HEX-kleurcode met 3 of 6 tekens; # is optioneel. Bijvoorbeeld #D94A4A of #fff.'
      pattern:
        regex: ^\s*#?([0-9a-fA-F]{3}|[0-9a-fA-F]{6})\s*$
        message: 'Gebruik een geldige HEX-kleurcode, bijvoorbeeld #D94A4A.'
    - name: background
      label: Achtergrondkleur
      type: string
      required: true
      description: 'HEX-kleurcode met 3 of 6 tekens; # is optioneel. Bijvoorbeeld #D94A4A of #fff.'
      pattern:
        regex: ^\s*#?([0-9a-fA-F]{3}|[0-9a-fA-F]{6})\s*$
        message: 'Gebruik een geldige HEX-kleurcode, bijvoorbeeld #D94A4A.'
    - name: text
      label: Tekstkleur
      type: string
      required: true
      description: 'HEX-kleurcode met 3 of 6 tekens; # is optioneel. Bijvoorbeeld #D94A4A of #fff.'
      pattern:
        regex: ^\s*#?([0-9a-fA-F]{3}|[0-9a-fA-F]{6})\s*$
        message: 'Gebruik een geldige HEX-kleurcode, bijvoorbeeld #D94A4A.'
    - name: headings
      label: Kleur van grote titels en koppen
      type: string
      required: true
      description: 'HEX-kleurcode met 3 of 6 tekens; # is optioneel. Bijvoorbeeld #D94A4A of #fff.'
      pattern:
        regex: ^\s*#?([0-9a-fA-F]{3}|[0-9a-fA-F]{6})\s*$
        message: 'Gebruik een geldige HEX-kleurcode, bijvoorbeeld #D94A4A.'
    - name: secondary
      label: Kleur van ondertitels en overige kleine tekst
      type: string
      required: true
      description: 'HEX-kleurcode met 3 of 6 tekens; # is optioneel. Bijvoorbeeld #D94A4A of #fff.'
      pattern:
        regex: ^\s*#?([0-9a-fA-F]{3}|[0-9a-fA-F]{6})\s*$
        message: 'Gebruik een geldige HEX-kleurcode, bijvoorbeeld #D94A4A.'
    - name: buttonText
      label: Tekstkleur van de gekleurde luisterknop
      type: string
      required: true
      description: 'HEX-kleurcode met 3 of 6 tekens; # is optioneel. Bijvoorbeeld #D94A4A of #fff.'
      pattern:
        regex: ^\s*#?([0-9a-fA-F]{3}|[0-9a-fA-F]{6})\s*$
        message: 'Gebruik een geldige HEX-kleurcode, bijvoorbeeld #D94A4A.'
    - name: surface
      label: Achtergrondkleur van kaarten
      type: string
      required: true
      description: 'HEX-kleurcode met 3 of 6 tekens; # is optioneel. Bijvoorbeeld #D94A4A of #fff.'
      pattern:
        regex: ^\s*#?([0-9a-fA-F]{3}|[0-9a-fA-F]{6})\s*$
        message: 'Gebruik een geldige HEX-kleurcode, bijvoorbeeld #D94A4A.'
    - name: borders
      label: Kleur van lijnen en randen
      type: string
      required: true
      description: 'HEX-kleurcode met 3 of 6 tekens; # is optioneel. Bijvoorbeeld #D94A4A of #fff.'
      pattern:
        regex: ^\s*#?([0-9a-fA-F]{3}|[0-9a-fA-F]{6})\s*$
        message: 'Gebruik een geldige HEX-kleurcode, bijvoorbeeld #D94A4A.'
    description: Rood blijft een accent. Kleine accentteksten en knoptekst worden zo nodig aangepast voor
      leesbaar contrast. Controleer je eigen tekstkleuren na wijzigingen.
- name: homepage
  label: Content, releases & contact
  type: file
  path: content.json
  format: json
  fields:
  - name: stats
    label: Statistieken onder de hero
    type: object
    description: Total streams en countries streaming pas je handmatig aan. Official releases wordt automatisch uit de zichtbare releasecatalogus berekend en per 5 afgerond.
    fields:
    - name: upcomingReleases
    label: Aankomende releases & pre-saves
    type: object
    list:
      collapsible:
        collapsed: true
        summary: "{title} — {releaseDate}"
    description: Voeg een release één keer toe. Koppel een smartlink/pre-saveprovider zoals Feature.fm. Die provider kan de DSP-links op releasedag automatisch scannen en follow-acties uitvoeren waar ondersteund.
    fields:
    - name: releases
    label: Uitgebrachte releases
    type: object
    list:
      collapsible:
        collapsed: true
        summary: "{title} — {artist}"
    fields:
    - name: links
    label: Explore: sets, playlists & downloads
    type: object
    list: true
    fields:
    - name: shows
    label: Shows
    type: object
    list:
      collapsible:
        collapsed: true
        summary: "{date} — {title}"
    fields:
    - name: bandsintown
    label: Bandsintown-link
    type: string
    description: Volledige artiestenlink met ID, bijvoorbeeld https://www.bandsintown.com/a/15598110-no-sync.
      Deze bepaalt welke shows automatisch laden.
  - name: socials
    label: Socials
    type: object
    list:
      collapsible:
        collapsed: true
        summary: "{type}"
    fields:
    - name: presskit
    label: Presskit-link
    type: string
    description: Gebruik de volledige https://-link. Links openen in een nieuw tabblad.
  - name: contacts
    label: Contactadressen
    type: object
    list:
      collapsible:
        collapsed: true
        summary: "{label} — {email}"
    fields:
  
actions:
- name: publish-namecheap
  label: Publiceer naar Namecheap
  workflow: deploy-namecheap.yml
  ref: current
  cancelable: false
  confirm:
    title: Website live publiceren?
    message: Publiceert exact deze geteste GitHub-versie naar Namecheap. Controleer eerst de GitHub Pages-preview.
    button: Publiceer
