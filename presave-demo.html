<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#101010">
  <title>Push — No Sync Pre-save Demo</title>
  <link rel="icon" href="media/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css?v=20261001-presave-demo-1">
  <style>
    .demo-label{display:inline-flex;margin-bottom:14px;padding:5px 9px;border:1px solid var(--borders);border-radius:3px;color:var(--secondary);font-size:11px;font-weight:600;letter-spacing:.1em}
    .demo-button{cursor:default}
  </style>
</head>
<body>
  <main class="presave-page">
    <div class="presave-shell">
      <span class="demo-label">PREVIEW ONLY</span>
      <a class="presave-back" href="./">← Back to No Sync</a>
      <article class="presave-card">
        <div class="presave-card-inner">
          <div class="presave-art">
            <img src="media/i-just-wanna-know.webp" alt="Demo release artwork" width="900" height="900">
          </div>
          <div class="presave-copy">
            <p class="eyebrow">COMING SOON</p>
            <h1>PUSH</h1>
            <p class="presave-meta">No Sync</p>
            <p class="presave-date">23 OCTOBER 2026</p>
            <p class="presave-countdown">22 DAYS TO GO</p>
            <div class="presave-actions">
              <span class="button button-accent demo-button">Pre-save on Spotify</span>
            </div>
            <p class="presave-note">By continuing, Spotify may ask permission to save the release and follow No Sync.</p>
          </div>
        </div>
      </article>
      <p class="presave-status">Demo only — the button is intentionally inactive.</p>
    </div>
  </main>
</body>
</html>
